plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.dispatch.port'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.dispatch.port'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        // uso personal: la versión de depuración se instala directo (firmada con la clave de depuración del SDK)
        debug { }
    }
}
